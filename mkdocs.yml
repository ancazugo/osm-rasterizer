site_name: osm-rasterizer
site_description: Rasterize OpenStreetMap vector features into GeoTIFF rasters
site_url: https://ancazugo.github.io/osm-rasterizer/
repo_url: https://github.com/ancazugo/osm-rasterizer
repo_name: ancazugo/osm-rasterizer

theme:
  name: material
  logo: assets/logos/osm-rasterizer-mono-white.svg
  favicon: assets/logos/osm-rasterizer-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            filters: ["!^_"]
            show_source: true

nav:
  - Home: index.md
  - Installation: installation.md
  - CLI Usage: cli.md
  - Examples: examples.md
  - Python API: api.md
